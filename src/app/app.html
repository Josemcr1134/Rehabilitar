<header class="app-header">
  <h1>Conciliación Rehabilitar</h1>
  <p>Cruce de AGENDA · CAJA · CONSUMO — migración a Angular en curso</p>
</header>

<nav class="app-nav">
  @for (item of nav; track item.ruta) {
    <a [routerLink]="item.ruta" routerLinkActive="activo" [class.bloqueado]="item.requiereLogin && !appState.token()"
       [title]="item.requiereLogin && !appState.token() ? 'Necesitas iniciar sesión primero' : ''">
      {{ item.etiqueta }} @if (item.requiereLogin && !appState.token()) { 🔒 }
    </a>
  }
</nav>

<main class="app-main">
  <router-outlet />
</main>
